services:
  db:
    image: mariadb:11.4
    platform: linux/arm64
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: forgottenserver
      MARIADB_USER: tfs
      MARIADB_PASSWORD: tfspass
      MARIADB_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/arm64
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "7171:7171"
      - "7172:7172"
    volumes:
      - ./config.lua:/srv/config.lua
      - ./data:/srv/data

  web:
    build:
      context: ./web
    platform: linux/arm64
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./web:/var/www/html

volumes:
  db-data:
